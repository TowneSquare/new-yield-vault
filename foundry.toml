[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
]
optimizer = true
optimizer_runs = 200
via_ir = true

# Fork-test RPC endpoints. Values come from the environment (.env) so that no URL or
# API key is ever committed to source. Reference these in tests with vm.rpcUrl("<key>"),
# never a literal URL.
[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
monad = "${MONAD_RPC_URL}"
base = "${BASE_RPC_URL}"
bsc = "${BSC_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
